    <rect x="7"  y="30" width="86" height="22" rx="7" fill="#5B6B8C" opacity="0.70"/>
    <rect x="0"  y="60" width="100" height="22" rx="7" fill="#5B6B8C" opacity="0.95"/>
    <!-- bolt -->
    <path d="M64 -8 L38 40 L54 40 L34 92 L74 32 L56 32 L78 -8 Z"
          fill="url(#bolt)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <text class="wordmark" x="136" y="82">Layer<tspan fill="#7C5CFF">StoRm</tspan></text>
