<svg viewBox="0 0 620 128" width="620" height="128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LayerStoRm" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .wordmark { fill: #8A93A6; font: 800 46px/1 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: -0.5px; }
  </style>
  <defs>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FA8FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
